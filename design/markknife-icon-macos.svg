<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 135° 蓝→紫 渐变,与启动页 logo 一致 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b86ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- macOS 规范:1024 画布内,824×824 圆角矩形本体,四周约 100px 留白,圆角 ~185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- Markknife 标志:M + 刀(由 120 视图的 1a 等比放大: scale=824/104≈7.923, 平移使方块对齐 100~924) -->
  <g transform="translate(36.62 36.62) scale(7.923)" fill="#ffffff">
    <polyline points="34 84 34 42 60 66 86 42" fill="none" stroke="#ffffff"
              stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="81" y="38" width="10" height="20" rx="4"/>
    <rect x="78" y="58" width="16" height="4.5" rx="2"/>
    <path d="M81 63 L91 63 L91 80 Q91 86.5 86 89 Q81 86.5 81 80 Z"/>
  </g>
</svg>
