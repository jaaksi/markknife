<svg width="56" height="56" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 135° 蓝→紫 渐变,沿用品牌主题色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b86ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- 渐变圆角方块底 -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#bg)"/>

  <!-- 字母 M:左竖 + 中峰 V(白色描边) -->
  <polyline points="34 84 34 42 60 66 86 42" fill="none" stroke="#fff"
            stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右竖线 = 一把刀(刀尖朝下、钝化,与 M 右肩相连,刀底齐 M 左脚底) -->
  <rect x="81" y="38" width="10" height="20" rx="4" fill="#fff"/>
  <rect x="78" y="58" width="16" height="4.5" rx="2" fill="#fff"/>
  <path d="M81 63 L91 63 L91 80 Q91 86.5 86 89 Q81 86.5 81 80 Z" fill="#fff"/>
</svg>
