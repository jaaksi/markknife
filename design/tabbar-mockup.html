<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Markknife · 标签栏(方案 B 定稿)</title>
<style>
  :root{
    --bg:#FFFFFF; --fg:#37352F; --muted-fg:#787774; --muted:#F0F0EF;
    --hover:#EBEBEA; --border:#E9E9E7; --primary:#155DFF; --sidebar:#F7F6F3; --page:#E7E7E4;
  }
  .dark{
    --bg:#1F1E1B; --fg:#E6E1D8; --muted-fg:#B8B1A6; --muted:#262520;
    --hover:#2D2B27; --border:#34322D; --primary:#78A4FF; --sidebar:#191814; --page:#121110;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--page);font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;
    color:var(--fg);padding:40px 28px 80px;transition:background .2s}
  .wrap{max-width:920px;margin:0 auto}
  h1{font-size:24px;font-weight:700;margin:0 0 4px}
  .sub{margin:0;color:var(--muted-fg);font-size:14px}
  .toggle{margin:20px 0 18px;display:flex;gap:8px}
  .toggle button{background:var(--bg);color:var(--fg);border:1px solid var(--border);padding:7px 14px;border-radius:9px;font-size:13px;cursor:pointer}
  .toggle button.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}

  .window{border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.12);background:var(--bg)}
  .toolbar{height:52px;display:flex;align-items:stretch;gap:8px;border-bottom:1px solid var(--border);
    background:var(--bg);padding-left:84px;padding-right:14px;position:relative}
  .traffic{position:absolute;left:18px;top:50%;transform:translateY(-50%);display:flex;gap:8px}
  .traffic i{width:12px;height:12px;border-radius:50%;display:block}
  .traffic .r{background:#ff5f57}.traffic .y{background:#febc2e}.traffic .g{background:#28c840}
  .center{display:flex;align-items:center}

  .iconbtn{width:30px;height:30px;border:0;background:transparent;border-radius:7px;color:var(--fg);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;align-self:center}
  .iconbtn:hover{background:var(--hover)}
  .iconbtn svg{width:17px;height:17px}

  .modes{display:flex;align-items:center;gap:2px;background:var(--muted);border-radius:8px;padding:2px;flex-shrink:0;align-self:center}
  .modes .m{width:28px;height:28px;border:0;background:transparent;border-radius:6px;color:var(--muted-fg);
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  .modes .m svg{width:16px;height:16px}
  .modes .m.active{background:var(--bg);color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  /* 标签栏:按内容宽、可收缩、横向滚动;拖拽空白 grow=安全间距 */
  .tabbar{display:flex;align-items:stretch;min-width:0;flex:0 1 auto;overflow-x:auto;
    scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 16px),transparent 100%)}
  .tabbar::-webkit-scrollbar{display:none}
  .drag{flex:1 1 0;min-width:20px}

  /* ===== 方案 B 底部下划线式 ===== */
  .tab{flex-shrink:0;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
    height:52px;padding:0 10px 0 12px;border-bottom:2px solid transparent;
    font-size:13px;color:var(--muted-fg);max-width:200px;
    transition:color .12s ease,border-color .12s ease}
  .tab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab:hover{color:var(--fg)}
  .tab.active{color:var(--fg);border-bottom-color:var(--primary);font-weight:550}

  /* 关键:固定宽度槽位,始终占位 → 标签总宽恒定,hover 不撑宽不闪 */
  .slot{position:relative;width:16px;height:16px;flex-shrink:0}
  .slot .dot{position:absolute;inset:0;margin:auto;width:7px;height:7px;border-radius:50%;
    background:color-mix(in srgb,var(--muted-fg) 55%,transparent);opacity:0;transition:opacity .12s ease}
  .slot .x{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:5px;
    color:var(--muted-fg);opacity:0;pointer-events:none;transition:opacity .12s ease,background .12s ease}
  .slot .x:hover{background:var(--hover);color:var(--fg)}
  .slot .x svg{width:11px;height:11px}
  /* 三态(均在固定槽位内切换 opacity,不改变布局):
     dirty 且未 hover/active → 圆点;hover 或 active → ✕;否则空 */
  .tab.dirty .dot{opacity:1}
  .tab:hover .dot,.tab.active .dot{opacity:0}
  .tab:hover .slot .x,.tab.active .slot .x{opacity:1;pointer-events:auto}

  .newtab{flex-shrink:0;align-self:center;width:26px;height:26px;border:0;background:transparent;border-radius:6px;
    color:var(--muted-fg);display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:2px}
  .newtab:hover{background:var(--hover);color:var(--fg)}
  .newtab svg{width:14px;height:14px}

  .body{padding:26px 30px;min-height:160px}
  .body .t{font-size:20px;font-weight:700;margin:0 0 14px}
  .body .ln{height:10px;border-radius:5px;background:var(--muted);margin:9px 0}
  .note{margin:14px 2px 0;font-size:12.5px;color:var(--muted-fg)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Markknife · 标签栏(方案 B · 底部下划线)</h1>
  <p class="sub">已修复抖动:每个标签右侧留固定槽位,未保存圆点 / 关闭 ✕ 在槽内切换,标签宽度恒定,hover 不再闪。</p>
  <div class="toggle">
    <button data-t="light" class="on">浅色</button>
    <button data-t="dark">深色</button>
  </div>
  <div id="root"></div>
  <p class="note">把鼠标依次划过各个标签:✕ 出现/消失时标签宽度不变(对比未保存圆点位置)。标签多时标签栏内部横向滚动,右侧模式组固定可见。</p>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-folder" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></g>
    <g id="i-eye" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g>
    <g id="i-pencil" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></g>
    <g id="i-split" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><line x1="12" y1="4" x2="12" y2="20"/></g>
    <g id="i-gear" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></g>
    <g id="i-x" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></g>
    <g id="i-plus" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></g>
  </defs>
</svg>

<script>
  const ico = (id) => `<svg viewBox="0 0 24 24"><use href="#${id}"/></svg>`
  const TABS = [
    { name: '产品需求文档.md', active: true },
    { name: '周报-2026-06.md', dirty: true },
    { name: '会议纪要.md' },
    { name: '技术架构设计.md', dirty: true },
    { name: 'Roadmap.md' },
    { name: '灵感收集箱.md' },
    { name: '待办清单.md' },
  ]
  const tabHtml = (t) => `
    <div class="tab${t.active ? ' active' : ''}${t.dirty ? ' dirty' : ''}">
      <span class="nm">${t.name}</span>
      <span class="slot"><span class="dot"></span><span class="x" title="关闭">${ico('i-x')}</span></span>
    </div>`
  document.getElementById('root').innerHTML = `
    <div class="window">
      <div class="toolbar">
        <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        <button class="iconbtn" title="打开文件">${ico('i-folder')}</button>
        <div class="tabbar">${TABS.map(tabHtml).join('')}
          <button class="newtab" title="新建标签">${ico('i-plus')}</button>
        </div>
        <div class="drag"></div>
        <div class="modes">
          <button class="m active" title="查看">${ico('i-eye')}</button>
          <button class="m" title="所见即所得">${ico('i-pencil')}</button>
          <button class="m" title="分栏">${ico('i-split')}</button>
        </div>
        <button class="iconbtn" title="设置">${ico('i-gear')}</button>
      </div>
      <div class="body">
        <p class="t">产品需求文档.md</p>
        <div class="ln" style="width:92%"></div><div class="ln" style="width:78%"></div>
        <div class="ln" style="width:85%"></div><div class="ln" style="width:60%"></div>
      </div>
    </div>`

  document.querySelectorAll('.toggle button').forEach((b) => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.toggle button').forEach((x) => x.classList.remove('on'))
      b.classList.add('on')
      document.body.classList.toggle('dark', b.dataset.t === 'dark')
    })
  })
  document.getElementById('root').addEventListener('click', (e) => {
    const x = e.target.closest('.x'); const tab = e.target.closest('.tab')
    if (x) return
    if (!tab) return
    tab.parentElement.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'))
    tab.classList.add('active')
  })
</script>
</body>
</html>
